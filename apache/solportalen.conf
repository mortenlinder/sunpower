<VirtualHost *:80>
    ServerName solportal.local
    DocumentRoot /opt/solportalen/public
    <Directory /opt/solportalen/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    ErrorLog ${APACHE_LOG_DIR}/solportalen-error.log
    CustomLog ${APACHE_LOG_DIR}/solportalen-access.log combined
</VirtualHost>
